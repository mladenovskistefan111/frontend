name: CI

# Pull-request gate. Nothing runs on a plain push; images are published by release.yaml.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/go-ci.yaml@7920b90327af737e69d1b7a7f16a9f92bbd952d6 # v1.0.0

  image:
    needs: [go]
    permissions:
      contents: read
      packages: write
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/docker-build.yaml@7920b90327af737e69d1b7a7f16a9f92bbd952d6 # v1.0.0

  workflows:
    permissions:
      contents: read
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/workflow-lint.yaml@7920b90327af737e69d1b7a7f16a9f92bbd952d6 # v1.0.0
