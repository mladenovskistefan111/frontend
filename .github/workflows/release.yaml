name: Release

# Runs when a semver tag is pushed (git tag -a v1.2.3 && git push origin v1.2.3) or by hand.
# Gates: same as CI. Then the scanned image digest is promoted to Docker Hub and signed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Promote the scanned image to Docker Hub and sign it (commit must be on main)
        type: boolean
        default: false

permissions: {}

jobs:
  go:
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/go-ci.yaml@87fca0e809f6ba84b782bc2fb2cc1d740b3c877f # v1.1.0

  image:
    needs: [go]
    permissions:
      contents: read
      packages: write
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/docker-build.yaml@87fca0e809f6ba84b782bc2fb2cc1d740b3c877f # v1.1.0

  workflows:
    permissions:
      contents: read
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/workflow-lint.yaml@87fca0e809f6ba84b782bc2fb2cc1d740b3c877f # v1.1.0

  promote:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
    needs: [image, workflows]
    permissions:
      id-token: write # keyless cosign signing
      contents: read
      packages: read
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/docker-promote.yaml@87fca0e809f6ba84b782bc2fb2cc1d740b3c877f # v1.1.0
    with:
      image-name: frontend
      staged-image: ${{ needs.image.outputs.staged-image }}
      digest: ${{ needs.image.outputs.digest }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
