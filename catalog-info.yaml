apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: frontend
  title: frontend
  description: "The HTTP web storefront for the platform-demo e-commerce platform."
  annotations:
    github.com/project-slug: platform-boutique/app-frontend
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-id: frontend
    backstage.io/kubernetes-namespace: platform-demo
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=frontend
    argocd/app-name: dev-frontend
    grafana/dashboard-selector: "tags @> 'frontend'"
    grafana/alert-label-selector: "service=frontend"
    grafana/overview-dashboard: "https://grafana.platform-demo.test/d/frontend-overview"
  tags: [go, http]
  links:
    - { url: "https://github.com/platform-boutique/app-frontend", title: Repository, icon: github }
    - { url: "https://argocd.platform-demo.test/applications/argocd/dev-frontend", title: Argo CD, icon: dashboard }
    - { url: "https://grafana.platform-demo.test/d/frontend-overview", title: Grafana dashboard, icon: dashboard }
spec:
  type: website
  lifecycle: experimental
  owner: group:default/maintainers
  system: shop
  consumesApis: [ad-service-api, cart-service-api, checkout-service-api, currency-service-api, product-catalog-service-api, recommendation-service-api, shipping-service-api]
  dependsOn:
    - component:default/ad-service
    - component:default/cart-service
    - component:default/checkout-service
    - component:default/currency-service
    - component:default/product-catalog-service
    - component:default/recommendation-service
    - component:default/shipping-service
